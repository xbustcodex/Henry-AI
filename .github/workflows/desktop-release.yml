name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build and upload artifacts for inspection. They publish nothing:
  # the same tag already carries a live release for installed Henrys, and
  # re-uploading over it would replace files those installs are downloading.
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Release classification ──────────────────────────────────────────────────
  # One definition of "is this a release?" and "is it a pre-release?", shared by
  # every job. Publishing and the GitHub prerelease flag are two halves of one
  # decision: a tag pushed as a pre-release but published as a normal release
  # hands the build to every stable Henry, because installed clients run with
  classify:
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.classify.outputs.is_tag }}
      is_prerelease: ${{ steps.classify.outputs.is_prerelease }}
      publish: ${{ steps.classify.outputs.publish }}
      ep_pre_release: ${{ steps.classify.outputs.ep_pre_release }}
    steps:
      - id: classify
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          is_tag=false
          [[ "$REF" == refs/tags/v* ]] && is_tag=true
          # Semver: any pre-release marker in the version (1.0.0-beta.1, -rc.1).
          is_prerelease=false
          if [ "$is_tag" = true ] && [[ "$REF_NAME" == *-* ]]; then is_prerelease=true; fi
          publish=never;    [ "$is_tag" = true ] && publish=always
          ep_pre_release=false; [ "$is_prerelease" = true ] && ep_pre_release=true
          {
            echo "is_tag=$is_tag"
            echo "is_prerelease=$is_prerelease"
            echo "publish=$publish"
            echo "ep_pre_release=$ep_pre_release"
          } >> "$GITHUB_OUTPUT"
          echo "ref=$REF tag=$is_tag prerelease=$is_prerelease publish=$publish"

  # ── Mac ───────────────────────────────────────────────────────────────────
  build-mac:
    needs: [classify]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --include=dev

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Clean up any stuck DMG volumes
        run: |
          hdiutil detach "/Volumes/Henry AI" 2>/dev/null || true
          hdiutil detach "/Volumes/Henry AI 1" 2>/dev/null || true

      - name: Build Vite (Mac)
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Build Mac DMG (unsigned — artifact only, never published; signed Mac DMGs are built+notarized locally)
        timeout-minutes: 8
        run: npx electron-builder --mac --config.mac.identity=null --config.compression=normal --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: henry-mac
          path: release2/*.dmg
          retention-days: 2

  # ── Windows ───────────────────────────────────────────────────────────────
  build-win:
    needs: [classify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --include=dev

      - name: Rebuild native modules for Electron
        run: npm run rebuild
        continue-on-error: true

      - name: Build Vite (Windows)
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Build Windows installer
        shell: bash
        run: npx electron-builder --win --x64 --publish "${{ needs.classify.outputs.publish }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
          # electron-builder has no --prerelease flag; EP_PRE_RELEASE is what
          # its GitHub publisher reads to create the release as a pre-release.
          EP_PRE_RELEASE: ${{ needs.classify.outputs.ep_pre_release }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: henry-win
          path: release2/*.exe
          retention-days: 2

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    needs: [classify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Linux build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rpm fakeroot dpkg-dev
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps --include=dev

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Build Vite (Linux)
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Build Linux AppImage + deb
        run: npx electron-builder --linux --x64 --publish "${{ needs.classify.outputs.publish }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_PRE_RELEASE: ${{ needs.classify.outputs.ep_pre_release }}

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: henry-linux-appimage
          path: release2/*.AppImage
          retention-days: 2

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: henry-linux-deb
          path: release2/*.deb
          retention-days: 2

  # ── Create GitHub Release ─────────────────────────────────────────────────
  release:
    needs: [build-mac, build-win, build-linux, classify]
    runs-on: ubuntu-latest
    if: needs.classify.outputs.is_tag == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.classify.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
